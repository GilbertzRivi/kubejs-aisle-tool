pluginManagement {
    // The `hc` plugin comes straight from a local HotChocolate checkout (same layout as PhoenixEssentials).
    includeBuild '../../PhoenixVineDigital/HotChocolate'
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.parchmentmc.org' }
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
